<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="shortcut icon" href="./assets/calculadora.webp" type="image/x-icon">
    <title>Calculadora</title>
</head>

<body>
    <header>
        <h1>Calculadora</h1>
        <button id="modos" onclick="modo()">modo escuro</button>
    </header>
    <main>
        <article>
            <section id="resposta">
                <p> </p>
            </section>
            <div id="teclado">
                <section class="dig">
                    <div class="num">
                        <button class="btn">1</button><button class="btn">2</button><button class="btn">3</button>
                    </div>
                    <div class="num">
                        <button class="btn">4</button><button class="btn">5</button><button class="btn">6</button>
                    </div>
                    <div class="num">
                        <button class="btn">7</button><button class="btn">8</button><button class="btn">9</button>
                    </div>
                    <div class="num">
                        <button class="btn">0</button>
                    </div>
                </section>

                <section class="dig">
                    <div class="num">
                        <button>+</button>
                        <button>-</button>
                    </div>
                    <div class="num">
                        <button>x</button>
                        <button>÷</button>                       
                    </div>
                    <div class="num">
                        <button>⌫</button>
                        <button>C</button>
                    </div>
                    <div class="num">
                        <button>=</button>
                    </div> 
                </section>
            </div>
        </article>
    </main>
    <footer>
        <p>&copy; 2025 - Todos os direitos reservados</p>
        <a href="https://www.github.com/rafael-np" target="_blank"> 
            <img src="./assets/github.png" alt="github">
        </a>
    </footer>
    <script src="./js/script.js"></script>
</body>

</html>
